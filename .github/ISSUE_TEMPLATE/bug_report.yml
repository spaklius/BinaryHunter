name: Bug report
description: Report a reproducible BinaryHunter application problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach customer ECU firmware, VINs, credentials or proprietary files.
  - type: input
    id: version
    attributes:
      label: BinaryHunter version or commit
      placeholder: 1.0.0 or commit SHA
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, x64
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - ECU identification
        - Binary search
        - Supported ECU catalogue
        - User interface
        - Build or startup
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest repeatable sequence without private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove VINs, paths, customer data and firmware content first.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed private and customer data from this report.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
