name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BinaryHunter.UI/BinaryHunter.UI.csproj

      - name: Build
        run: dotnet build BinaryHunter.UI/BinaryHunter.UI.csproj --configuration Release --no-restore
